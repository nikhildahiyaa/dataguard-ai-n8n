# Add-on for an already running DataGuard AI installation.
# Run: docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up -d --build dashboard
services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    environment:
      DATAGUARD_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
